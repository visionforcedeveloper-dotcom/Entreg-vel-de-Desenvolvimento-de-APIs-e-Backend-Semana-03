# ==========================================
# Configuração do banco H2 em memória
# ==========================================
spring.datasource.url=jdbc:h2:mem:alunosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialeto JPA para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Cria/atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# Exibe as queries SQL no console (útil para depuração)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2 (acesse: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Porta da aplicação
server.port=8080
